<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Strict policy: scripts, data and workers only from this site, so nothing can be sent elsewhere.
     'wasm-unsafe-eval' lets the barcode reader (WebAssembly) start; no other eval is allowed. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Convert a Finnish virtual barcode (virtuaaliviivakoodi) into a printable bank barcode and back: create, validate, save as PNG/SVG/PDF, print, read from photos, PDFs and the camera. Runs entirely in the browser.">
<title>vcode2bar – virtual barcode ↔ bank barcode</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="icon.svg" alt="" width="36" height="36">
    <div>
      <h1>vcode2bar</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
  </div>
  <div class="top-actions">
    <label class="lang"><span data-i18n="language" class="sr-only"></span>
      <select id="lang" aria-label="Language"></select>
    </label>
    <button id="btn-help" class="ghost" type="button" data-i18n="help"></button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab-main" aria-controls="panel-main" aria-selected="true" data-i18n="tab_main"></button>
  <button role="tab" id="tab-create" aria-controls="panel-create" aria-selected="false" data-i18n="tab_create"></button>
  <button role="tab" id="tab-list" aria-controls="panel-list" aria-selected="false"></button>
</nav>

<main>
  <!-- ======================================================= Barcode -->
  <section id="panel-main" role="tabpanel" aria-labelledby="tab-main" class="panel">
    <label for="input" class="lead" data-i18n="paste_hint"></label>
    <textarea id="input" rows="3" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    <div class="row">
      <button id="btn-paste" type="button" data-i18n="paste"></button>
      <button id="btn-open" type="button" data-i18n="load"></button>
      <button id="btn-paste-img" type="button" data-i18n="paste_img"></button>
      <button id="btn-camera" type="button" data-i18n="camera"></button>
      <button id="btn-clear" type="button" class="ghost" data-i18n="clear"></button>
      <span id="count" class="muted"></span>
    </div>
    <input id="file" type="file" multiple accept="image/*,.pdf,application/pdf,.csv,text/csv" hidden>
    <p id="status" class="status" aria-live="polite"></p>

    <dl id="details" class="details"></dl>

    <figure class="preview" id="preview" aria-live="off"></figure>
    <div class="row between">
      <label class="check"><input type="checkbox" id="show-text"> <span data-i18n="show_text"></span></label>
      <span id="verify" class="verify"></span>
    </div>
    <div class="row actions">
      <button id="btn-png" type="button" class="primary" data-i18n="save_png" disabled></button>
      <button id="btn-svg" type="button" data-i18n="save_svg" disabled></button>
      <button id="btn-pdf" type="button" data-i18n="save_pdf" disabled></button>
      <button id="btn-print" type="button" data-i18n="print_" disabled></button>
      <button id="btn-add" type="button" data-i18n="add" disabled></button>
      <button id="btn-csv1" type="button" data-i18n="csv_one" disabled></button>
    </div>
    <p id="msg" class="msg" aria-live="polite"></p>
    <p class="hint" data-i18n="drop_hint"></p>
  </section>

  <!-- ======================================================= Create -->
  <section id="panel-create" role="tabpanel" aria-labelledby="tab-create" class="panel" hidden>
    <p class="lead" data-i18n="create_intro"></p>
    <div class="form">
      <label for="f-iban" data-i18n="f_iban"></label>
      <input id="f-iban" class="mono" autocomplete="off" spellcheck="false" inputmode="text" placeholder="FI00 0000 0000 0000 00">
      <span class="hint" id="h-iban"></span>

      <label for="f-amount" data-i18n="f_amount"></label>
      <input id="f-amount" class="mono" autocomplete="off" inputmode="decimal" placeholder="0,00">
      <span class="hint" id="h-amount"></span>

      <label for="f-reference" data-i18n="f_ref"></label>
      <div class="inline">
        <input id="f-reference" class="mono" autocomplete="off" spellcheck="false">
        <button id="btn-check" type="button" class="small" data-i18n="btn_check"></button>
        <button id="btn-rf" type="button" class="small" data-i18n="btn_rf"></button>
      </div>
      <span class="hint" id="h-reference"></span>

      <label for="f-due" data-i18n="f_due"></label>
      <input id="f-due" class="mono" autocomplete="off" placeholder="dd.mm.yyyy">
      <span class="hint" id="h-due"></span>
    </div>
    <div class="result">
      <label for="f-result" data-i18n="f_result"></label>
      <div class="inline">
        <input id="f-result" class="mono" readonly>
        <button id="btn-fcopy" type="button" class="small" data-i18n="copy" disabled></button>
      </div>
    </div>
    <p id="fstatus" class="status" aria-live="polite"></p>
    <div class="row actions">
      <button id="btn-fshow" type="button" class="primary" data-i18n="show_bar" disabled></button>
      <button id="btn-fadd" type="button" data-i18n="add" disabled></button>
      <button id="btn-fclear" type="button" class="ghost" data-i18n="clear_form"></button>
    </div>
    <figure class="preview" id="fpreview"></figure>
  </section>

  <!-- ======================================================= List -->
  <section id="panel-list" role="tabpanel" aria-labelledby="tab-list" class="panel" hidden>
    <div class="table-wrap">
      <table id="table">
        <thead><tr>
          <th class="sel"><input type="checkbox" id="sel-all" aria-label="select all"></th>
          <th data-i18n="col_source"></th><th data-i18n="col_iban"></th><th class="num" data-i18n="col_amount"></th>
          <th data-i18n="col_ref"></th><th data-i18n="col_due"></th><th data-i18n="code"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
      <p id="list-empty" class="muted center" data-i18n="list_empty"></p>
    </div>
    <div class="row actions">
      <button id="btn-edit" type="button" data-i18n="to_editor"></button>
      <button id="btn-remove" type="button" data-i18n="remove"></button>
      <button id="btn-clearlist" type="button" class="ghost" data-i18n="clear_list"></button>
      <span class="spacer"></span>
      <button id="btn-import" type="button" data-i18n="import_csv"></button>
      <label class="fmt"><span data-i18n="csv_fmt"></span>
        <select id="csv-fmt"><option value="excel"></option><option value="std"></option></select>
      </label>
      <button id="btn-export" type="button" class="primary" data-i18n="csv_all"></button>
    </div>
    <input id="csvfile" type="file" accept=".csv,.txt,text/csv,text/plain" hidden>
    <p class="hint" data-i18n="import_hint"></p>
    <p id="lmsg" class="msg" aria-live="polite"></p>
  </section>
</main>

<footer>
  <p data-i18n="privacy"></p>
  <p><a id="link-source" href="#" rel="noopener" data-i18n="source_code"></a> ·
     <a id="link-python" href="#" rel="noopener" data-i18n="python_version"></a> ·
     <span id="foot-version"></span></p>
  <p class="muted"><span id="foot-license"></span> · <span id="foot-copyright"></span> ·
     <a href="THIRD-PARTY-NOTICES.txt" rel="noopener" data-i18n="third_party"></a></p>
</footer>

<div id="drop" class="drop" hidden><div data-i18n="drop_here"></div></div>

<dialog id="dlg-help" class="dlg wide">
  <form method="dialog" class="dlg-head"><h2 data-i18n="help"></h2><button class="ghost" data-i18n="close"></button></form>
  <div class="dlg-body">
    <h3 data-i18n="guide"></h3><div id="help-guide" class="prose"></div>
    <h3 data-i18n="shortcuts"></h3><table id="help-keys" class="keys"></table>
    <h3 data-i18n="format_info"></h3><table id="help-format" class="keys"></table><p id="help-format-note" class="prose"></p>
    <pre id="help-format-example" class="mono example"></pre>
    <h3 data-i18n="about"></h3><div id="help-about" class="prose"></div>
    <h3 data-i18n="third_party"></h3><pre id="help-notices" class="mono example notices"></pre>
  </div>
</dialog>

<dialog id="dlg-camera" class="dlg">
  <form method="dialog" class="dlg-head"><h2 data-i18n="camera_title"></h2><button class="ghost" data-i18n="camera_stop"></button></form>
  <div class="dlg-body">
    <div class="video-wrap"><video id="video" muted playsinline></video><div class="frame"></div></div>
    <p class="hint" data-i18n="camera_hint"></p>
  </div>
</dialog>

<dialog id="dlg-notice" class="dlg">
  <form method="dialog" class="dlg-head"><h2 id="notice-title"></h2><button class="ghost" data-i18n="close"></button></form>
  <div class="dlg-body"><pre id="notice-text" class="notice"></pre></div>
</dialog>

<script src="js/code128-table.js"></script>
<script src="js/strings-core.js"></script>
<script src="js/strings-web.js"></script>
<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/reader.js"></script>
<script src="js/app.js"></script>
</body>
</html>
