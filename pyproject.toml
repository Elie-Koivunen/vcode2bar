# Optional packaging. vcode2bar stays a single file that runs as `python vcode2bar.py`;
# `pip install .` (or `pipx install .`) additionally gives you `vcode2bar` and `vcode2bar-gui` commands.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vcode2bar"
dynamic = ["version"]
description = "Finnish virtual barcode (virtuaaliviivakoodi) <-> bank barcode: create, validate, render, print and read back. GUI + CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "PolyForm-Noncommercial-1.0.0" }   # SPDX id; versions up to 1.3.2 were MIT
authors = [{ name = "Elie Koivunen" }]
keywords = ["virtuaaliviivakoodi", "pankkiviivakoodi", "virtual barcode", "bank barcode", "code128",
            "finland", "invoice", "iban", "rf reference", "viitenumero"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Free for non-commercial use",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Tk",
    "Environment :: Console",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Natural Language :: English",
    "Natural Language :: Finnish",
    "Natural Language :: Swedish",
    "Natural Language :: Norwegian",
]
dependencies = ["python-barcode>=0.15", "pillow>=10.1"]

[project.optional-dependencies]
# reading barcodes from photos/scans + the read-back check, and reading invoice PDFs
read = ["pyzbar>=0.1.9", "pypdfium2>=4.0"]

[project.scripts]
vcode2bar = "vcode2bar:cli"

[project.gui-scripts]
vcode2bar-gui = "vcode2bar:gui_main"

[project.urls]
Homepage = "https://github.com/Elie-Koivunen/vcode2bar"
Documentation = "https://github.com/Elie-Koivunen/vcode2bar/blob/main/README.md"
Changelog = "https://github.com/Elie-Koivunen/vcode2bar/blob/main/CHANGELOG.md"
Issues = "https://github.com/Elie-Koivunen/vcode2bar/issues"

[tool.setuptools]
py-modules = ["vcode2bar"]

[tool.setuptools.dynamic]
version = { attr = "vcode2bar.__version__" }
